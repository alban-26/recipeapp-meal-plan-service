openapi: 3.0.1
info:
  title: Meal Plan API
  version: 1.0.0
  description: API for managing meal plans

paths:
  /mealPlans:
    get:
      summary: Get all meal plans
      operationId: getMealPlans
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealPlanDto'

    post:
      summary: Create a new meal plan
      operationId: createMealPlan
      parameters:
        - name: generateShoppingList
          in: query
          required: false
          description: Whether to immediately create a shopping list for the new meal plan
          schema:
            type: boolean
      security:
        - oidcAuth: [ "user" ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanDto'
      responses:
        '201':
          description: Meal plan created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanDto'

  /mealPlans/{id}:
    get:
      summary: Get a meal plan by ID
      operationId: getMealPlanById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the meal plan to retrieve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Meal plan found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanDto'
        '404':
          description: Meal plan not found

    put:
      summary: Update an existing meal plan
      operationId: updateMealPlan
      security:
        - oidcAuth: [ "user" ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the meal plan to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanDto'
      responses:
        '200':
          description: Meal plan updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanDto'
        '400':
          description: Invalid request or data format
        '404':
          description: Meal plan not found

    delete:
      summary: Delete a meal plan by ID
      operationId: deleteMealPlan
      security:
        - oidcAuth: [ "user" ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the meal plan to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Meal plan deleted successfully
        '404':
          description: Meal plan not found

  /mealPlans/{mealPlanId}/dailyMealPlans/{dailyMealPlanId}:
    put:
      summary: Update a specific daily meal plan within a meal plan
      operationId: updateDailyMealPlan
      security:
        - oidcAuth: [ "user" ]
      parameters:
        - name: mealPlanId
          in: path
          required: true
          description: The ID of the meal plan that contains the daily meal plan.
          schema:
            type: integer
            format: int64
        - name: dailyMealPlanId
          in: path
          required: true
          description: The ID of the daily meal plan to update.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMealPlanDto'
      responses:
        '200':
          description: Daily meal plan updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMealPlanDto'
        '400':
          description: Invalid input or request format
        '404':
          description: Meal plan or daily meal plan not found

    delete:
      summary: Delete a specific daily meal plan within a meal plan
      operationId: deleteDailyMealPlan
      security:
        - oidcAuth: [ "user" ]
      parameters:
        - name: mealPlanId
          in: path
          required: true
          description: The ID of the parent meal plan.
          schema:
            type: integer
            format: int64
        - name: dailyMealPlanId
          in: path
          required: true
          description: The ID of the daily meal plan to delete.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Daily meal plan deleted successfully
        '404':
          description: Daily meal plan not found

  /mealPlans/recipes:
    get:
      summary: Get all recipes
      operationId: getRecipes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeDto'

  /mealPlans/generateShoppingList:
    post:
      summary: Generate a shopping list for a meal plan
      operationId: generateShoppingList
      security:
        - oidcAuth: [ "user" ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanDto'
      responses:
        '200':
          description: Shopping list generated successfully
        '400':
          description: Invalid meal plan data

components:
  schemas:

    MealPlanDto:
      type: object
      description: A plan of meals scheduled over multiple days.
      properties:
        id:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dailyMealPlans:
          type: array
          items:
            $ref: '#/components/schemas/DailyMealPlanDto'

    DailyMealPlanDto:
      type: object
      description: A set of meals planned for a single day.
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        meals:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/MealDto'
          example:
            BREAKFAST:
              - recipe:
                  id: 1
                  name: "Pancakes"
                servings: 2
            DINNER:
              - recipe:
                  id: 2
                  name: "Spaghetti Bolognese"
                servings: 2

    MealDto:
      type: object
      description: A specific recipe and number of servings for a mealtime.
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeDto'
        servings:
          type: integer
          description: Number of servings to be prepared for this meal.

    RecipeDto:
      type: object
      description: Basic information about a recipe.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    RecipeIngredientDto:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum:
            - DAIRY
            - MEAT
            - FISH
            - BAKERY
            - FRUITS
            - VEGETABLES
            - BEVERAGES
            - FROZEN
            - DRY_GOODS
            - SWEETS
            - ORGANIC
            - VEGAN
            - ELECTRONICS
            - CLOTHING
            - BOOKS
            - HOME_AND_KITCHEN
            - BEAUTY
            - SPORTS
            - TOYS
            - AUTOMOTIVE
            - OTHER
        quantity:
          type: number
          format: double
        unit:
          type: string

    Mealtime:
      type: string
      enum:
        - BREAKFAST
        - BRUNCH
        - LUNCH
        - SNACK
        - DINNER
